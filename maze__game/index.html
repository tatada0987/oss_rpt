<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>3D 미로 게임</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        #clearText {
            display: none;

            position: absolute;
            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            font-size: 80px;
            font-weight: bold;
            color: yellow;
        }

        #info {
            position: absolute;
            top: 20px;
            left: 20px;

            color: white;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <div id="info">
        WASD로 이동하세요!
    </div>

    <div id="clearText">
        CLEAR!
    </div>


    <!-- Three.js -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
        }
    }
    </script>


    <!-- 게임 코드 -->
    <script type="module" src="./main.js"></script>

</body>

</html>
